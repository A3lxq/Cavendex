[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cavendex"
version = "0.1.0"
description = "AI-driven SOC incident response platform: multi-agent triage/investigation/response over your own SIEM/EDR data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-groq>=0.2.0",
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "langchain-ollama>=0.2.0",
    "langchain-community>=0.3.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0.0",
    "chromadb>=0.5.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.30.0",
    "pyyaml>=6.0.0",
    "requests>=2.31.0",
    "tldextract>=5.0.0",
    "redis>=5.0.0",
    "pyjwt[crypto]>=2.10.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0.0"]

[project.scripts]
cavendex = "launcher:main"

[tool.setuptools]
py-modules = [
    "api",
    "cli",
    "graph",
    "state",
    "main",
    "syslog_listener",
    "ingest_watch",
    "poll_connector",
    "crowdstrike_connector",
    "sentinel_connector",
    "vault_backup",
    "launcher",
]

[tool.setuptools.packages.find]
include = [
    "agents*",
    "enrichment*",
    "ingestion*",
    "memory*",
    "notifications*",
    "playbooks*",
    "remediation*",
    "utils*",
    "workflows*",
    "static*",
]

[tool.setuptools.package-data]
static = ["**/*"]
